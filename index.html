<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Laporan Kegiatan Harian - PERUMDA Air Minum Kota Makassar</title>
    <meta name="description" content="Sistem Laporan Kegiatan Harian Pegawai PERUMDA Air Minum Kota Makassar">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #F4F6F9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        #app-frame {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            z-index: 9999;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }
        #loading-screen.fade-out {
            opacity: 0;
            visibility: hidden;
        }
        .spinner {
            width: 42px;
            height: 42px;
            border: 4px solid #E5E9F0;
            border-top: 4px solid #165DFF;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loading-text {
            font-size: 14px;
            font-weight: 600;
            color: #080C1A;
        }
        .loading-sub {
            font-size: 12px;
            color: #6A7686;
        }
    </style>
</head>
<body>
    <div id="loading-screen">
        <div class="spinner"></div>
        <div class="loading-text">Memuat Sistem Laporan Harian...</div>
        <div class="loading-sub">PERUMDA Air Minum Kota Makassar</div>
    </div>

    <iframe
        id="app-frame"
        src="https://script.google.com/macros/s/AKfycbyBJQjgfHUX7GXCjHKLD83RQnjtAT83QF_sYVfLf0WGVCVgMV9f-lJHDAs9TKagSaow/exec"
        allow="camera; microphone; geolocation"
        onload="hideLoader()">
    </iframe>

    <script>
        function hideLoader() {
            const loader = document.getElementById('loading-screen');
            if (loader) {
                loader.classList.add('fade-out');
                setTimeout(() => {
                    loader.style.display = 'none';
                }, 400);
            }
        }
        setTimeout(hideLoader, 3000);
    </script>
</body>
</html>
